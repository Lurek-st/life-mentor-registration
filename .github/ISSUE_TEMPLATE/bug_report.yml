name: 问题反馈 / Bug report
description: 使用虚构信息描述问题；安全漏洞请私下报告。
body:
  - type: markdown
    attributes:
      value: 请勿提交真实姓名工号、报名凭证、口令、备份或私人部署配置。漏洞请使用 Security 页面的私下报告。
  - type: input
    id: version
    attributes:
      label: 版本与运行环境
      placeholder: 版本、Node 版本、操作系统、浏览器、本机或自有云环境
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与预期结果
      description: 请提供最小、虚构的复现示例。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 附上已删去敏感信息的错误说明。
    validations:
      required: true
